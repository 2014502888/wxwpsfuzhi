name: Build dylib

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Compile arm64 dylib
        run: |
          mkdir -p out
          xcrun -sdk iphoneos clang \
            -arch arm64 \
            -mios-version-min=15.0 \
            -fobjc-arc \
            -Wno-deprecated-declarations \
            -framework Foundation \
            -framework UIKit \
            -framework WebKit \
            -framework CoreGraphics \
            -lz \
            WXExcelCopy/Tweak.m \
            WXExcelCopy/JSBridge.m \
            WXExcelCopy/XLSXParser.m \
            WXExcelCopy/Toast.m \
            WXExcelCopy/WebViewProbe.m \
            -dynamiclib \
            -o out/WXExcelCopy.dylib
          ls -la out/
          file out/WXExcelCopy.dylib

      - name: Self-check JS script embedded
        run: |
          echo "--- JSBridge.m info ---"
          wc -l WXExcelCopy/JSBridge.m
          shasum WXExcelCopy/JSBridge.m
          echo "--- script strings check in dylib ---"
          if strings out/WXExcelCopy.dylib | grep -q 'setInterval'; then
            echo "OK: 注入脚本已嵌入 (setInterval found)"
          else
            echo "::error::注入脚本缺失! setInterval not found in dylib"
            strings out/WXExcelCopy.dylib | grep -i 'wxExcelCopy\|evaluateJavaScript\|injectInto' | head -30
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: wxexcelcopy-dylib
          path: out/WXExcelCopy.dylib
