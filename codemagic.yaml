# Codemagic 编译配置 —— 微信 xlsx 复制插件（dylib）
# 仓库：https://github.com/2014502888/wxwpsfuzhi
# 用途：绕过 GitHub macOS runner 排队，改用 Codemagic 编译
# 触发：push 到 master / 网页手动 Build
workflows:
  build-dylib:
    name: Build dylib
    max_build_duration: 10
    instance_type: mac_mini_m1
    environment:
      xcode: latest
    scripts:
      - name: Compile arm64 dylib
        script: |
          mkdir -p out
          xcrun -sdk iphoneos clang \
            -arch arm64 \
            -mios-version-min=15.0 \
            -fobjc-arc \
            -Wno-deprecated-declarations \
            -framework Foundation \
            -framework UIKit \
            -framework WebKit \
            -framework CoreGraphics \
            -lz \
            WXExcelCopy/Tweak.m \
            WXExcelCopy/JSBridge.m \
            WXExcelCopy/XLSXParser.m \
            WXExcelCopy/Toast.m \
            WXExcelCopy/WebViewProbe.m \
            -dynamiclib \
            -o out/WXExcelCopy.dylib
          ls -la out/
          file out/WXExcelCopy.dylib
    artifacts:
      - out/WXExcelCopy.dylib
